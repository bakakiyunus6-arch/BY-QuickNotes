<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>BY Quick Notes</title>

    <meta name="theme-color" content="#007bff">

    <link rel="manifest" href="manifest.json">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            padding: 20px;
        }

        .app {
            max-width: 400px;
            margin: 40px auto;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 12px #ccc;
        }

        textarea {
            width: 100%;
            height: 180px;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            margin-top: 12px;
        }
    </style>
</head>

<body>

<div class="app">

    <h2>BY Quick Notes 📝</h2>

    <input type="text" id="title" placeholder="Note title">

<textarea id="note" placeholder="Write your note here..."></textarea>

<button onclick="saveNote()">Add Note</button>

<div id="notes-list"></div>

    <p id="message"></p>

</div>

<script>
    const title = document.getElementById("title");
const note = document.getElementById("note");
const notesList = document.getElementById("notes-list");

let notes = JSON.parse(localStorage.getItem("notes")) || [];

function saveNote() {
    const newNote = {
        id: Date.now(),
        title: title.value,
        content: note.value
    };

    if (!title.value.trim() || !note.value.trim()) {
        alert("Please enter a title and note.");
        return;
    }

    notes.push(newNote);

    localStorage.setItem("notes", JSON.stringify(notes));

    title.value = "";
    note.value = "";

    displayNotes();
}

function displayNotes() {
    notesList.innerHTML += `
    <div>
        <h3>${item.title}</h3>
        <p>${item.content}</p>
        <button onclick="deleteNote(${item.id})">Delete</button>
    </div>
`;
    function deleteNote(id) {
    notes = notes.filter(item => item.id !== id);

    localStorage.setItem("notes", JSON.stringify(notes));

    displayNotes();
    }
    
        `;
    });
}

displayNotes();
</script>

</body>
</html>
